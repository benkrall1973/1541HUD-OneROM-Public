name: Release verification

on:
  pull_request:
  push:
    branches:
      - main
      - v8.0

jobs:
  verify:
    runs-on: windows-latest
    steps:
      # actions/checkout v4, pinned to its official v4 tag commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify package integrity and manifest policy
        shell: pwsh
        run: ./tools/verify-release.ps1
